; ESP32-S3 edge node: DHT22 + MQ-2 + VS1838B IR receiver -> MQTT
;
; Build:   pio run
; Flash:   pio run -t upload            (board on the "UART"/"COM" USB-C port)
;          pio run -e esp32s3-usb -t upload   (board on the native "USB" port)
; Monitor: pio device monitor

[platformio]
default_envs = esp32s3

[env]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    256dpi/MQTT@^2.5.2
    bblanchon/ArduinoJson@^7.2.0
    beegee-tokyo/DHT sensor library for ESPx@^1.19
    z3t0/IRremote@^4.4.1
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DIR_SEND_DUTY_CYCLE_PERCENT=50
; Cable in the USB-C port labelled "UART" / "COM" (CH340/CP210x bridge)
[env:esp32s3]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

; Cable in the USB-C port labelled "USB" (native USB, shows as "USB JTAG/serial debug unit")
[env:esp32s3-usb]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
