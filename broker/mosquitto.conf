# Local Mosquitto for the smart-home project (LAN / classroom use, no auth).
# Run from the repo root:
#   "C:\Program Files\mosquitto\mosquitto.exe" -c broker\mosquitto.conf -v

per_listener_settings false
allow_anonymous true

# ESP32 connects here (use the laptop's Wi-Fi IPv4 as MQTT_HOST)
listener 1883 0.0.0.0
protocol mqtt

# Browser dashboard connects here: ws://localhost:9001
listener 9001
protocol websockets
